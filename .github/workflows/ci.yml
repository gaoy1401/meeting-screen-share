name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-and-protocols:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: python3 -m compileall -q linux-client scripts
      - run: PYTHONPATH=linux-client python3 linux-client/check-client.py
      - run: PYTHONPATH=linux-client python3 linux-client/check-hardware-screen.py
      - run: python3 scripts/export-source.py --check
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/package-mac.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-preview
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: ./windows-client/scripts/build-release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-preview
          path: |
            windows-client/dist/*.zip
            windows-client/dist/*.exe
            windows-client/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
